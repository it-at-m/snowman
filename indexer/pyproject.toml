[project]
name = "snow-search-indexer"
version = "0.1.0"
description = "Source-independent document indexing pipeline for Qdrant."
readme = "README.md"
requires-python = "==3.13.11"
dependencies = [
    "fastembed==0.8.0",
    "gitpython==3.1.58",
    "httpx==0.28.1",
    "jupyter==1.1.1",
    "langchain-community==0.4.2",
    "langchain-core==1.4.9",
    "langchain-openai==1.3.5",
    "langchain-qdrant==1.1.0",
    "langchain-text-splitters==1.1.2",
    "markdownify==1.2.3",
    "mcp==1.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "qdrant-client==1.18.0",
    "requests==2.34.2",
    "truststore==0.10.4",
]

[project.scripts]
snow-search-indexer = "src.main:main"

[dependency-groups]
beta-typing = ["ty==0.0.59"]
lint = ["ruff==0.15.21"]

[tool.uv]
add-bounds = "exact"
default-groups = ["lint"]
