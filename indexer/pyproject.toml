[project]
name = "snow-search-indexer"
version = "0.1.0"
description = "Source-independent document indexing pipeline for Qdrant."
readme = "README.md"
requires-python = "==3.13.11"
dependencies = [
    "authlib==1.8.0",
    "fastembed==0.9.1",
    "gitpython==3.1.59",
    "httpx==0.28.1",
    "jupyter==1.1.1",
    "langchain-community==0.4.2",
    "langchain-core==1.8.4",
    "langchain-openai==1.8.5",
    "langchain-qdrant==1.1.0",
    "langchain-text-splitters==1.1.3",
    "markdownify==1.2.4",
    "mcp==1.30.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.4",
    "qdrant-client==1.20.0",
    "requests==2.34.2",
    "truststore==0.10.5",
]

[project.scripts]
snow-search-indexer = "src.main:main"

[dependency-groups]
beta-typing = ["ty==0.0.107"]
lint = ["ruff==0.17.6"]

[tool.uv]
add-bounds = "exact"
default-groups = ["lint"]
