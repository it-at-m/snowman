default:
  tags: [openshift-test-capk]

stages:
  - test
  - check
  - apply-configmap
  - deploy
  - deploy-charts
  - build-image
  - deploy-dev
  - deploy-test
  - deploy-production

#####################
# --- Templates --- #
#####################

.apply-configmap:
  image: quay.io/openshift/origin-cli
  before_script:
    - oc login $OPENSHIFT_API_URL --namespace=$OPENSHIFT_NAMESPACE --token=$OPENSHIFT_TOKEN
  script:
    - oc apply -f infrastructure/snow-search-config-$ENV_NAME.yaml

.check-charts:
  image: docker.io/alpine/helm
  variables:
    HTTP_PROXY: http://internet-proxy-server.muenchen.de:80
    HTTPS_PROXY: http://internet-proxy-server.muenchen.de:80
    NO_PROXY: localhost,*.svc,svc.local,*svc.cluster.local,muenchen.de
  script:
    - helm dependency build $HELM_CHART
    - helm lint $HELM_CHART --values=$HELM_VALUES
    - helm template $HELM_RELEASE $HELM_CHART --values=$HELM_VALUES
    - helm install $HELM_RELEASE $HELM_CHART --values=$HELM_VALUES --namespace $OPENSHIFT_NAMESPACE --kube-apiserver $OPENSHIFT_API_URL --kube-token=$OPENSHIFT_TOKEN --dry-run=server

.deploy-charts:
  image: docker.io/alpine/helm
  variables:
    HTTP_PROXY: http://internet-proxy-server.muenchen.de:80
    HTTPS_PROXY: http://internet-proxy-server.muenchen.de:80
    NO_PROXY: localhost,*.svc,svc.local,*svc.cluster.local,muenchen.de
  script:
    - helm dependency build $HELM_CHART
    - helm upgrade $HELM_RELEASE $HELM_CHART --values=$HELM_VALUES --namespace $OPENSHIFT_NAMESPACE --kube-apiserver $OPENSHIFT_API_URL --kube-token=$OPENSHIFT_TOKEN --install

.build-image:
  image: quay.io/openshift/origin-cli
  before_script:
    - oc login $OPENSHIFT_API_URL --namespace=$OPENSHIFT_NAMESPACE --token=$OPENSHIFT_TOKEN
  script:
    - oc start-build $OPENSHIFT_BUILDCONFIG --from-dir=$APP_BUILD_DIRECTORY --follow --wait

.deploy:
  image: quay.io/openshift/origin-cli
  before_script:
    - oc login $OPENSHIFT_API_URL --namespace=$OPENSHIFT_NAMESPACE --token=$OPENSHIFT_TOKEN
  script:
    - QUAY_AUTH=$(oc extract secrets/$QUAY_SECRET --confirm)
    - oc image mirror -a $QUAY_AUTH $IMAGE_REGISTRY/$QUAY_ORGANISATION/$OPENSHIFT_IMAGE:$OPENSHIFT_SOURCE_TAG $IMAGE_REGISTRY/$QUAY_ORGANISATION/$OPENSHIFT_IMAGE:$OPENSHIFT_DEST_TAG
    - if [ "$SKIP_DEPLOYMENT" = "true" ]; then exit 0; fi
    - oc rollout restart deployment/$OPENSHIFT_DEPLOYMENT
    - oc rollout status deployment/$OPENSHIFT_DEPLOYMENT --timeout=300s

variables:
  OPENSHIFT_NAMESPACE_DEV: snow-semantic-squirrel-dev
  OPENSHIFT_NAMESPACE_TEST: snow-semantic-squirrel-test

  OPENSHIFT_DEV_API_URL: https://api.test.capk.muenchen.de:6443
  OPENSHIFT_TEST_API_URL: https://api.test.capk.muenchen.de:6443

  ENV_NAME_DEV: dev
  ENV_NAME_TEST: test

  HELM_CHART: ./infrastructure/charts/snow-search
  HELM_RELEASE_DEV: snow-search-dev
  HELM_RELEASE_TEST: snow-search-test
  HELM_VALUES_DEV: ./infrastructure/values-snow-search-dev.yaml
  HELM_VALUES_TEST: ./infrastructure/values-snow-search-test.yaml

  OPENSHIFT_DEV_TOKEN: $OPENSHIFT_C_TOKEN
  OPENSHIFT_TEST_TOKEN: $OPENSHIFT_K_TOKEN
  OPENSHIFT_BRANCH_INTEGRATION: "true"
  OPENSHIFT_BRANCH_DEPLOYMENT: "true"
  QUAY_ORGANISATION: cap-snow-semantic-squirrel
  QUAY_SECRET: cap-injected-quay-secret
  IMAGE_REGISTRY: capquay.muenchen.de

  OPENSHIFT_BASE_TAG: latest
  OPENSHIFT_DEV_TAG: dev
  OPENSHIFT_TEST_TAG: test
  SKIP_DEPLOYMENT: "false"

  # Version des Qdrant-Helm-Charts: https://github.com/qdrant/qdrant-helm
  # renovate: datasource=github-releases depName=qdrant/qdrant-helm versioning=loose extractVersion=qdrant-(?<version>.*)
  QDRANT_CHART_VERSION: 1.18.2

include:
  # Fuer Branch Pipelines
  - template: "Workflows/Branch-Pipelines.gitlab-ci.yml"
  - template: "Security/SAST-IaC.latest.gitlab-ci.yml"
  - project: "kicc/gitlab-runner-templates"
    ref: "chore-cap4v2-compat"
    file:
      # Qdrant Helm Chart Deployment (stages: check, deploy)
      - "Qdrant-Helm.gitlab-ci.yml"

####################
# ---- Qdrant ---- #
####################

# Wird alles im importierten Template "Qdrant-Helm.gitlab-ci.yml" definiert.
# Das Template erwartet root-level values-qdrant-dev.yaml und values-qdrant-test.yaml.
#
# Override: allow deploy-qdrant-dev on non-default branches as long as
# namespace and values exist. All other settings mirror the template job.
deploy-qdrant-dev:
  stage: deploy
  environment:
    name: $OPENSHIFT_DEV_ENV
    url: "$OPENSHIFT_DEV_CONSOLE_URL/topology/ns/$OPENSHIFT_NAMESPACE_DEV"
  extends: .deploy-qdrant
  rules:
    - if: ($OPENSHIFT_NAMESPACE_DEV == null || $OPENSHIFT_NAMESPACE_DEV == "")
      when: never
    - if: $QDRANT_CHART_DEV_VALUES != null
      exists: [$QDRANT_CHART_DEV_VALUES]
      when: manual
  allow_failure: true
  needs: [check-qdrant-dev]
  variables:
    OPENSHIFT_TOKEN: $OPENSHIFT_DEV_TOKEN
    OPENSHIFT_LOGIN_URL: $OPENSHIFT_DEV_API_URL
    OPENSHIFT_NAMESPACE: $OPENSHIFT_NAMESPACE_DEV
    CHART_VALUES: $QDRANT_CHART_DEV_VALUES

########################
# -- Check Charts ---- #
########################

check-charts-dev:
  stage: check
  environment:
    name: $ENV_NAME_DEV
    deployment_tier: development
    action: verify
  rules:
    - if: $OPENSHIFT_NAMESPACE_DEV != null && $HELM_VALUES_DEV != null
  variables:
    OPENSHIFT_NAMESPACE: $OPENSHIFT_NAMESPACE_DEV
    OPENSHIFT_API_URL: $OPENSHIFT_DEV_API_URL
    OPENSHIFT_TOKEN: $OPENSHIFT_DEV_TOKEN
    HELM_RELEASE: $HELM_RELEASE_DEV
    HELM_VALUES: $HELM_VALUES_DEV
    ENV_NAME: $ENV_NAME_DEV
  extends: .check-charts

check-charts-test:
  stage: check
  environment:
    name: $ENV_NAME_TEST
    deployment_tier: testing
    action: verify
  rules:
    - if: $OPENSHIFT_NAMESPACE_TEST != null && $HELM_VALUES_TEST != null && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    OPENSHIFT_NAMESPACE: $OPENSHIFT_NAMESPACE_TEST
    OPENSHIFT_API_URL: $OPENSHIFT_TEST_API_URL
    OPENSHIFT_TOKEN: $OPENSHIFT_TEST_TOKEN
    HELM_RELEASE: $HELM_RELEASE_TEST
    HELM_VALUES: $HELM_VALUES_TEST
    ENV_NAME: $ENV_NAME_TEST
  extends: .check-charts

####################
# -- ConfigMaps -- #
####################

apply-configmap-dev:
  stage: apply-configmap
  environment:
    name: $ENV_NAME_DEV
    deployment_tier: development
    action: prepare
  rules:
     - if: $OPENSHIFT_NAMESPACE_DEV != null
       exists: [infrastructure/snow-search-config-dev.yaml]
  variables:
    OPENSHIFT_NAMESPACE: $OPENSHIFT_NAMESPACE_DEV
    OPENSHIFT_API_URL: $OPENSHIFT_DEV_API_URL
    OPENSHIFT_TOKEN: $OPENSHIFT_DEV_TOKEN
    ENV_NAME: $ENV_NAME_DEV
  extends: .apply-configmap

apply-configmap-test:
  stage: apply-configmap
  environment:
    name: $ENV_NAME_TEST
    deployment_tier: testing
    action: prepare
  rules:
     - if: $OPENSHIFT_NAMESPACE_TEST != null && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
       exists: [infrastructure/snow-search-config-test.yaml]
  variables:
    OPENSHIFT_NAMESPACE: $OPENSHIFT_NAMESPACE_TEST
    OPENSHIFT_API_URL: $OPENSHIFT_TEST_API_URL
    OPENSHIFT_TOKEN: $OPENSHIFT_TEST_TOKEN
    ENV_NAME: $ENV_NAME_TEST
  extends: .apply-configmap

###############################
# -- Deployment der Charts -- #
###############################

deploy-charts-dev:
  stage: deploy-charts
  environment:
    name: $ENV_NAME_DEV
    deployment_tier: development
    action: start
  needs:
    - job: check-charts-dev
    - job: apply-configmap-dev
      optional: true
  rules:
    - if: $OPENSHIFT_NAMESPACE_DEV != null && $HELM_VALUES_DEV != null
      allow_failure: false
  variables:
    OPENSHIFT_NAMESPACE: $OPENSHIFT_NAMESPACE_DEV
    OPENSHIFT_API_URL: $OPENSHIFT_DEV_API_URL
    OPENSHIFT_TOKEN: $OPENSHIFT_DEV_TOKEN
    HELM_RELEASE: $HELM_RELEASE_DEV
    HELM_VALUES: $HELM_VALUES_DEV
    ENV_NAME: $ENV_NAME_DEV
  extends: .deploy-charts

deploy-charts-test:
  stage: deploy-charts
  environment:
    name: $ENV_NAME_TEST
    deployment_tier: testing
    action: start
  needs:
    - job: check-charts-test
    - job: apply-configmap-test
      optional: true
  rules:
    - if: $OPENSHIFT_NAMESPACE_TEST != null && $HELM_VALUES_TEST != null && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false
  variables:
    OPENSHIFT_NAMESPACE: $OPENSHIFT_NAMESPACE_TEST
    OPENSHIFT_API_URL: $OPENSHIFT_TEST_API_URL
    OPENSHIFT_TOKEN: $OPENSHIFT_TEST_TOKEN
    HELM_RELEASE: $HELM_RELEASE_TEST
    HELM_VALUES: $HELM_VALUES_TEST
    ENV_NAME: $ENV_NAME_TEST
  extends: .deploy-charts

####################
# ----- MCP ------ #
####################

build-image-mcp:
  stage: build-image
  environment:
    name: $ENV_NAME_DEV
    deployment_tier: development
    action: start
  needs:
    - job: deploy-charts-dev
  rules:
    - if: $OPENSHIFT_NAMESPACE_DEV != null && $HELM_VALUES_DEV != null
      allow_failure: false
  variables:
    OPENSHIFT_NAMESPACE: $OPENSHIFT_NAMESPACE_DEV
    OPENSHIFT_API_URL: $OPENSHIFT_DEV_API_URL
    OPENSHIFT_TOKEN: $OPENSHIFT_DEV_TOKEN
    OPENSHIFT_BUILDCONFIG: snow-search-mcp
    APP_BUILD_DIRECTORY: mcp
    ENV_NAME: $ENV_NAME_DEV
  extends: .build-image

deploy-dev-mcp:
  stage: deploy-dev
  environment:
    name: $ENV_NAME_DEV
    deployment_tier: development
    action: start
  needs:
    - job: build-image-mcp
  rules:
    - if: $OPENSHIFT_NAMESPACE_DEV != null && $HELM_VALUES_DEV != null
      when: manual
  allow_failure: true
  variables:
    OPENSHIFT_NAMESPACE: $OPENSHIFT_NAMESPACE_DEV
    OPENSHIFT_API_URL: $OPENSHIFT_DEV_API_URL
    OPENSHIFT_TOKEN: $OPENSHIFT_DEV_TOKEN
    OPENSHIFT_IMAGE: snow-search-mcp
    OPENSHIFT_SOURCE_TAG: $OPENSHIFT_BASE_TAG
    OPENSHIFT_DEST_TAG: $OPENSHIFT_DEV_TAG
    OPENSHIFT_DEPLOYMENT: snow-search-mcp-dev
    ENV_NAME: $ENV_NAME_DEV
  extends: .deploy

deploy-test-mcp:
  stage: deploy-test
  environment:
    name: $ENV_NAME_TEST
    deployment_tier: testing
    action: start
  needs:
    - job: deploy-dev-mcp
    - job: deploy-charts-test
  rules:
    - if: $OPENSHIFT_NAMESPACE_TEST != null && $HELM_VALUES_TEST != null && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  allow_failure: true
  variables:
    OPENSHIFT_NAMESPACE: $OPENSHIFT_NAMESPACE_TEST
    OPENSHIFT_API_URL: $OPENSHIFT_TEST_API_URL
    OPENSHIFT_TOKEN: $OPENSHIFT_TEST_TOKEN
    OPENSHIFT_IMAGE: snow-search-mcp
    OPENSHIFT_SOURCE_TAG: $OPENSHIFT_DEV_TAG
    OPENSHIFT_DEST_TAG: $OPENSHIFT_TEST_TAG
    OPENSHIFT_DEPLOYMENT: snow-search-mcp-test
    ENV_NAME: $ENV_NAME_TEST
  extends: .deploy

####################
# --- Indexer ---- #
####################

# Indexer implementation and deployment are intentionally disabled for now.
# Uncomment these jobs once indexer/Dockerfile and the indexer OpenShift workload are ready.

####################
# ----- Prod ----- #
####################

# Prod deployment is intentionally commented out until a prod namespace, token,
# and API URL are available.
