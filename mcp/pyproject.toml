[project]
name = "snow-search-mcp"
version = "0.1.0"
description = "MCP server for retrieval over Qdrant"
readme = "README.md"
requires-python = "==3.13.11"
dependencies = [
    "cohere==7.3.1",
    "fastembed==0.9.1",
    "gitpython==3.1.59",
    "langchain-openai==1.7.4",
    "langchain-qdrant==1.1.0",
    "mcp==1.30.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "qdrant-client==1.20.0",
    "truststore==0.10.5",
]

[project.scripts]
snow-search-mcp = "src.main:main"

[dependency-groups]
beta-typing = ["ty==0.0.99"]
lint = ["ruff==0.17.4"]

[tool.uv]
add-bounds = "exact"
default-groups = ["lint"]
[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp"]
