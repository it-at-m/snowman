[project]
name = "snow-search-mcp"
version = "0.1.0"
description = "MCP server for retrieval over Qdrant"
readme = "README.md"
requires-python = "==3.13.11"
dependencies = [
    "cohere==7.0.5",
    "fastembed==0.8.0",
    "gitpython==3.1.58",
    "langchain-openai==1.3.5",
    "langchain-qdrant==1.1.0",
    "mcp==1.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "qdrant-client==1.18.0",
    "truststore==0.10.4",
]

[project.scripts]
snow-search-mcp = "src.main:main"

[dependency-groups]
beta-typing = ["ty==0.0.59"]
lint = ["ruff==0.15.21"]

[tool.uv]
add-bounds = "exact"
default-groups = ["lint"]
[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp"]
