# Workflow to release the Python application images
name: release

on:
  workflow_dispatch:
    inputs:
      app-path:
        type: choice
        description: Application to release
        required: true
        options:
          - mcp
          - indexer
      release-version:
        description: "Version to release, without a leading v (for example: 1.2.3)"
        required: true

jobs:
  release-image:
    name: Release ${{ inputs.app-path }} image
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    env:
      IMAGE_NAME: snow-search-${{ inputs.app-path }}
      RELEASE_VERSION: ${{ inputs.release-version }}
      RELEASE_TAG: ${{ inputs.app-path }}-${{ inputs.release-version }}

    steps:
      - name: Checkout
        uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@e967c9de8fb0197faf7a294d153efa76de5cec27 # v1.6.0

      - name: Validate release version
        run: |
          if [[ ! "${{ inputs.release-version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "release-version must be a semantic version like 1.2.3"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --project ${{ inputs.app-path }} --locked

      - name: Ruff check
        run: uv run --project ${{ inputs.app-path }} ruff check .

      - name: Ruff format check
        run: uv run --project ${{ inputs.app-path }} ruff format --check .

      - name: Prepare Docker artifact
        run: |
          mkdir -p build-context
          cp -a "${{ inputs.app-path }}" "build-context/${{ inputs.app-path }}"

      - name: Upload Docker artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.app-path }}
          path: build-context

      - name: Build and push image
        uses: it-at-m/lhm_actions/action-templates/actions/action-build-image@e967c9de8fb0197faf7a294d153efa76de5cec27 # v1.6.0
        with:
          path: ${{ inputs.app-path }}
          image-name: ${{ env.IMAGE_NAME }}
          artifact-name: ${{ inputs.app-path }}
          registry: ghcr.io
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-tags: |
            type=semver,pattern={{version}},value=${{ inputs.release-version }}
            type=sha,prefix=sha-,format=long

          image-labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.release-version }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${IMAGE_NAME} ${RELEASE_VERSION}" \
            --notes "Version tag: docker pull ghcr.io/${GITHUB_REPOSITORY}/${IMAGE_NAME}:${RELEASE_VERSION}
                     SHA tag: docker pull ghcr.io/${GITHUB_REPOSITORY}/${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            --generate-notes
