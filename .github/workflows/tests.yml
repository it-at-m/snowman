name: tests

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  tests:
    name: Test ${{ matrix.project }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        project:
          - mcp
          - indexer

    steps:
      - name: Checkout
        uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@4485daa4781dde13e7d9d5f4d8acbe33f993299c # v1.7.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --project ${{ matrix.project }} --locked

      - name: Run tests
        run: uv run --directory ${{ matrix.project }} python -m unittest discover -s tests -v
