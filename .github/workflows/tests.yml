name: tests

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  tests:
    name: Test ${{ matrix.project }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        project:
          - mcp
          - indexer

    steps:
      - name: Checkout
        uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@54b32c7d11363cad45838c9a3d8a8560b93f0e8c # v1.5.4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --project ${{ matrix.project }} --locked

      - name: Run tests
        run: uv run --directory ${{ matrix.project }} python -m unittest discover -s tests -v
