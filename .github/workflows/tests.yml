name: tests

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  tests:
    name: Test ${{ matrix.project }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        project:
          - mcp
          - indexer

    steps:
      - name: Checkout
        uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@808f574bd8867b31524b254679fc34fb1fd78ea2 # v1.6.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --project ${{ matrix.project }} --locked

      - name: Run tests
        run: uv run --directory ${{ matrix.project }} python -m unittest discover -s tests -v
