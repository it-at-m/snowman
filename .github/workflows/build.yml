name: build

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  test:
    name: Check MCP
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@7bed7092684c0bcc176811016aed27b532aa5f51 # v1.4.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --project mcp --locked

      - name: Ruff check
        run: uv run --project mcp ruff check .

      - name: Ruff format check
        run: uv run --project mcp ruff format --check .

      - name: Prepare Docker artifact
        run: |
          mkdir -p build-context
          cp -a mcp build-context/mcp

      - name: Upload Docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp
          path: build-context


  build-image:
    name: Build and push MCP image
    runs-on: ubuntu-latest

    needs:
      - test

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Build and push image
        uses: it-at-m/lhm_actions/action-templates/actions/action-build-image@7bed7092684c0bcc176811016aed27b532aa5f51 # v1.4.0
        with:
          path: mcp
          image-name: snow-search-mcp
          artifact-name: mcp
          registry: ghcr.io
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-tags: |
            type=raw,value=dev
