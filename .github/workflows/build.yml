name: build

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  test:
    name: Check MCP
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@54b32c7d11363cad45838c9a3d8a8560b93f0e8c # v1.5.4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --project mcp --locked

      - name: Ruff check
        run: uv run --project mcp ruff check .

      - name: Ruff format check
        run: uv run --project mcp ruff format --check .

      - name: Prepare Docker artifact
        run: |
          mkdir -p build-context
          cp -a mcp build-context/mcp

      - name: Upload Docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp
          path: build-context

  build-image:
    name: Build and push MCP image
    runs-on: ubuntu-latest
    needs:
      - test

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Build and push image
        uses: it-at-m/lhm_actions/action-templates/actions/action-build-image@54b32c7d11363cad45838c9a3d8a8560b93f0e8c # v1.5.4
        with:
          path: mcp
          image-name: snow-search-mcp
          artifact-name: mcp
          registry: ghcr.io
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-tags: |
            type=sha,prefix=sha-,format=long

          image-labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
