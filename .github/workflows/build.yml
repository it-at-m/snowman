name: build

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  check-mcp:
    name: Check MCP
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@808f574bd8867b31524b254679fc34fb1fd78ea2 # v1.6.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --project mcp --locked

      - name: Ruff check
        run: uv run --project mcp ruff check .

      - name: Ruff format check
        run: uv run --project mcp ruff format --check .

      - name: Prepare Docker artifact
        run: |
          mkdir -p build-context
          cp -a mcp build-context/mcp

      - name: Upload Docker artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp
          path: build-context

  build-image:
    name: Build and push MCP image
    runs-on: ubuntu-latest
    needs:
      - check-mcp

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Build and push image
        uses: it-at-m/lhm_actions/action-templates/actions/action-build-image@808f574bd8867b31524b254679fc34fb1fd78ea2 # v1.6.2
        with:
          path: mcp
          image-name: snow-search-mcp
          artifact-name: mcp
          registry: ghcr.io
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-tags: |
            type=sha,prefix=sha-,format=long

          image-labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}

  check-indexer:
    name: Check indexer
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@808f574bd8867b31524b254679fc34fb1fd78ea2 # v1.6.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --project indexer --locked

      - name: Ruff check
        run: uv run --project indexer ruff check .

      - name: Ruff format check
        run: uv run --project indexer ruff format --check .

      - name: Prepare Docker artifact
        run: |
          mkdir -p build-context
          cp -a indexer build-context/indexer

      - name: Upload Docker artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: indexer
          path: build-context

  build-indexer-image:
    name: Build and push indexer image
    runs-on: ubuntu-latest
    needs:
      - check-indexer

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Build and push image
        uses: it-at-m/lhm_actions/action-templates/actions/action-build-image@808f574bd8867b31524b254679fc34fb1fd78ea2 # v1.6.2
        with:
          path: indexer
          image-name: snow-search-indexer
          artifact-name: indexer
          registry: ghcr.io
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-tags: |
            type=sha,prefix=sha-,format=long

          image-labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
