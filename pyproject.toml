[project]
name = "SNOW-MCP-Search"
version = "0.1.0"
description = "Repository-level development tooling SNOW."
readme = "README.md"
requires-python = "==3.13.11"
dependencies = [
    "jupyter==1.1.1",
]

[dependency-groups]
dev = ["pre-commit==4.7.0"]
beta-typing = ["ty==0.0.104"]
lint = ["ruff==0.17.5"]

[tool.uv]
add-bounds = "exact"
default-groups = ["dev", "lint"]
package = false
